<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カード調整</title>
<style>
  :root {
    --bg: #1b1712; --panel: #241f17; --panel2: #2a241b; --line: #443a2c;
    --text: #eee5d8; --dim: #a89878; --accent: #d3a458; --accent-bg: #b98b3d;
    --good: #7fb069; --bad: #d9775b; --changed: #3d3320;
  }
  * { box-sizing: border-box; }
  body { font-family: "Yu Gothic UI", "Meiryo", sans-serif; background: var(--bg); color: var(--text); margin: 0; font-size: 14px; }
  #app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .filters { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
  .filters .row { display: flex; gap: 6px; flex-wrap: wrap; }
  input, select, textarea { font: inherit; padding: 5px 7px; border-radius: 4px; border: 1px solid #6b5a3f; background: var(--panel2); color: var(--text); }
  input[type=number] { width: 72px; }
  textarea { width: 100%; resize: vertical; min-height: 56px; }
  button { font: inherit; padding: 6px 14px; border-radius: 4px; border: none; background: var(--accent-bg); color: var(--bg); cursor: pointer; font-weight: bold; }
  button:hover { background: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.secondary { background: #4a4030; color: var(--text); }
  button.small { padding: 3px 9px; font-size: 12px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 12px; background: #4a4030; color: var(--text); font-weight: normal; }
  .chip.on { background: var(--accent-bg); color: var(--bg); }
  #list { overflow-y: auto; flex: 1; }
  .item { display: grid; grid-template-columns: 30px 1fr 44px 64px; gap: 6px; align-items: center; padding: 7px 12px; border-bottom: 1px solid #2e271d; cursor: pointer; }
  .item:hover { background: var(--panel); }
  .item.sel { background: var(--changed); }
  .item .cost { font-weight: bold; color: var(--accent); text-align: center; }
  .item .name small { color: var(--dim); margin-left: 4px; }
  .item .num, .item .rate { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 5px; vertical-align: middle; }
  main { overflow-y: auto; padding: 20px 28px 40px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 26px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .meta { color: var(--dim); font-size: 12px; }
  .grid { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; align-items: center; }
  .effect { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  .effect .desc { color: var(--dim); font-size: 12px; margin: 4px 0 8px; }
  .effect .fields { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 3px; background: #3a3124; margin-right: 4px; }
  .changed { background: var(--changed) !important; border-color: var(--accent) !important; }
  .warn { color: var(--bad); font-size: 12px; margin-top: 4px; }
  .note { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  #status { color: var(--accent); font-size: 13px; }
  table { border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 5px 12px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  th { color: var(--dim); font-weight: normal; }
  td.rate { font-weight: bold; }
  .bar { display: inline-block; height: 8px; background: var(--accent-bg); vertical-align: middle; margin-left: 6px; border-radius: 2px; }
  pre { background: #120f0b; border: 1px solid var(--line); border-radius: 4px; padding: 8px; font-size: 12px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
  .empty { color: var(--dim); padding: 40px; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="filters">
      <input id="search" type="search" placeholder="名前・id・効果文で絞り込む">
      <div class="row" id="kinds"></div>
      <div class="row" id="sets"></div>
    </div>
    <div id="list"></div>
  </aside>
  <main id="editor"><div class="empty">左の一覧からカードを選ぶ</div></main>
</div>

<script>
const EFFECT_VALUE_UNUSED = new Set(["DESTROY_UNIT", "SWAP_STATS", "SUMMON", "GRANT_KEYWORD", "SILENCE", "RETURN_TO_HAND", "INVERT_PLAYER_HP"]);
const TARGET_BAND = { low: 45, high: 55 };
const KINDS = [["all", "すべて"], ["unit", "砂時計"], ["spell", "砂術"], ["token", "トークン"], ["modified", "未コミットの変更"]];

let data = null;
let selectedId = null;
let draft = null;
let kind = "all";
let setFilter = null;
let job = null;

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const enumEntry = (name, i) => (data.enums[name] || [])[i] || { name: String(i), label: String(i), desc: "" };

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

async function load() {
  data = await api("/api/cards");
  data.cards.sort((a, b) => a.cost - b.cost || a.is_spell - b.is_spell || a.display_name.localeCompare(b.display_name, "ja"));
  renderFilters();
  renderList();
  if (selectedId) select(selectedId);
}

function renderFilters() {
  $("#kinds").innerHTML = KINDS.map(([k, label]) => `<button class="chip ${k === kind ? "on" : ""}" data-kind="${k}">${label}</button>`).join("");
  const sets = [...new Set(data.cards.map((c) => c.set_id))].sort();
  $("#sets").innerHTML = sets.map((s) => `<button class="chip ${s === setFilter ? "on" : ""}" data-set="${esc(s)}">${s ? esc(s) : "基本"}</button>`).join("")
;
}

function visibleCards() {
  const q = $("#search").value.trim();
  return data.cards.filter((c) => {
    if (kind === "unit" && (c.is_spell || c.is_token)) return false;
    if (kind === "spell" && !c.is_spell) return false;
    if (kind === "token" && !c.is_token) return false;
    if (kind === "modified" && !data.modified.includes(c.id)) return false;
    if (setFilter !== null && c.set_id !== setFilter) return false;
    return !q || c.display_name.includes(q) || c.id.includes(q) || c.rules_text.includes(q);
  });
}

function renderList() {
  $("#list").innerHTML = visibleCards().map((c) => {
    const rate = data.winrates[c.id] || "";
    return `<div class="item ${c.id === selectedId ? "sel" : ""}" data-id="${c.id}">
      <span class="cost">${c.cost}</span>
      <span class="name">${esc(c.display_name)}${data.modified.includes(c.id) ? '<span class="dot" title="未コミットの変更あり"></span>' : ""}<small>${c.is_spell ? "砂術" : c.is_token ? "トークン" : ""}</small></span>
      <span class="num">${c.is_spell ? "" : c.total_sand}</span>
      <span class="rate" style="color:${rateColor(rate)}">${esc(rate)}</span>
    </div>`;
  }).join("");
}

function rateColor(rate) {
  const v = parseFloat(rate);
  if (isNaN(v)) return "var(--dim)";
  if (v < TARGET_BAND.low) return "var(--bad)";
  if (v > TARGET_BAND.high) return "var(--good)";
  return "var(--text)";
}

function original() { return data.cards.find((c) => c.id === selectedId); }

function select(id) {
  selectedId = id;
  const card = original();
  if (!card) return;
  draft = structuredClone(card);
  if (!job || job.card_id !== id) job = null;
  renderList();
  renderEditor();
}

function effectLine(e) {
  const type = enumEntry("EffectType", e.effect_type);
  const parts = [
    `<span class="tag">${esc(enumEntry("Trigger", e.trigger).label)}</span>`,
    `<span class="tag" title="${esc(enumEntry("EffectTarget", e.target).desc)}">${esc(enumEntry("EffectTarget", e.target).label)}</span>`,
    `<span class="tag" title="${esc(type.desc)}">${esc(type.name)}</span>`,
  ];
  if (e.card_id) parts.push(`<span class="tag">出す: ${esc(e.card_id)}</span>`);
  if (e.keyword >= 0) parts.push(`<span class="tag">与える: ${esc(enumEntry("Keyword", e.keyword).label)}</span>`);
  if (e.condition_scope > 0) parts.push(`<span class="tag" title="${esc(enumEntry("ConditionScope", e.condition_scope).desc)}">条件: ${esc(enumEntry("ConditionScope", e.condition_scope).label)}</span>`);
  return parts.join("") + `<div class="desc">${esc(type.desc)}</div>`;
}

function renderEditor() {
  const card = original();
  const kw = card.keywords.map((k) => enumEntry("Keyword", k).label).join("・");
  const flags = [card.cannot_attack && "攻撃できない", card.cannot_flip && "反転できない",
    card.conditional_keyword >= 0 && `総量${card.conditional_keyword_total}のとき${enumEntry("Keyword", card.conditional_keyword).label}`].filter(Boolean).join("・");
  const effects = draft.effects.map((e, i) => {
    const valueUsed = !EFFECT_VALUE_UNUSED.has(enumEntry("EffectType", e.effect_type).name);
    const condUsed = e.condition_scope > 0 && enumEntry("ConditionScope", e.condition_scope).name !== "ATTACK_OVER_HEALTH";
    return `<div class="effect">
      <div><b>効果${i}</b> ${effectLine(e)}</div>
      <div class="fields">
        ${valueUsed ? `<label>value <input type="number" data-effect="${i}" data-key="value" value="${e.value}"></label>` : '<span class="meta">value は使わない</span>'}
        ${condUsed ? `<label>条件の総量 <input type="number" data-effect="${i}" data-key="condition_total" value="${e.condition_total}"></label>` : ""}
      </div>
    </div>`;
  }).join("") || '<div class="meta">固有効果なし</div>';

  $("#editor").innerHTML = `
    <h1>${esc(card.display_name)}</h1>
    <div class="meta">${esc(card.id)} ・ 追加順 ${card.pool_index} ・ ${card.set_id ? "セット " + esc(card.set_id) : "基本セット"}
      ${card.is_spell ? "・ 砂術" : ""}${card.is_token ? "・ トークン" : ""} ・ 一覧の勝率 <b style="color:${rateColor(data.winrates[card.id])}">${esc(data.winrates[card.id] || "—")}</b></div>

    <h2>数値</h2>
    <div class="grid">
      <label>コスト</label><div><input type="number" data-key="cost" value="${draft.cost}" min="0"></div>
      ${card.is_spell ? "" : `<label>総量</label><div><input type="number" data-key="total_sand" value="${draft.total_sand}" min="1"></div>`}
      ${kw ? `<label>キーワード</label><div>${esc(kw)}</div>` : ""}
      ${flags ? `<label>その他</label><div>${esc(flags)}</div>` : ""}
    </div>

    <h2>効果</h2>
    ${effects}
    <label class="meta">効果文(rules_text)</label>
    <textarea id="rules" data-key="rules_text">${esc(draft.rules_text)}</textarea>
    <div id="rulesWarn"></div>

    <div class="actions">
      <button id="save">保存(.tres と Hourglasses.md)</button>
      <button class="secondary" id="reset">入力を元に戻す</button>
      <span id="status"></span>
    </div>
    <div class="note">保存すると数値の変わったカードの勝率欄は「再測定待ち」になる。測り直して「採用して保存」を押すと勝率も書き込まれる。</div>
    <div id="saveInfo"></div>

    <h2>勝率を測る</h2>
    <div class="note" style="margin-top:0">保存済みの .tres を基準に、そのカード2枚入りデッキ vs 入っていないデッキで対戦させる(BalanceReport_v5.md 2章)。候補を書いた項目だけを振る。</div>
    <div class="grid" style="margin-top:10px">
      <label>戦数</label><div><input type="number" id="games" value="400" step="100" min="100"> <span class="meta">400戦で誤差±5pt、800戦で±3.5pt</span></div>
      <label>シード</label><div><input type="number" id="seed" value="42"></div>
      <label>コストの候補</label><div><input id="sweep" placeholder="例 3,4" style="width:140px"></div>
      ${card.is_spell ? "" : '<label>総量の候補</label><div><input id="totals" placeholder="例 6,7,8" style="width:140px"></div>'}
      ${draft.effects.length ? `<label>効果の値の候補</label><div><select id="effectIndex">${draft.effects.map((_, i) => `<option value="${i}">効果${i}</option>`).join("")}</select> <input id="values" placeholder="例 2,3" style="width:140px"></div>` : ""}
    </div>
    <div class="actions"><button id="measure">測る</button><span id="measureStatus" class="meta"></span></div>
    <div id="results"></div>`;
  refreshDirty();
  renderJob();
}

function refreshDirty() {
  const card = original();
  document.querySelectorAll("#editor [data-key]").forEach((el) => {
    const i = el.dataset.effect;
    const orig = i === undefined ? card[el.dataset.key] : card.effects[i][el.dataset.key];
    const cur = i === undefined ? draft[el.dataset.key] : draft.effects[i][el.dataset.key];
    el.classList.toggle("changed", orig !== cur);
  });
  const valueChanged = draft.effects.some((e, i) => e.value !== card.effects[i].value || e.condition_total !== card.effects[i].condition_total);
  $("#rulesWarn").innerHTML = valueChanged && draft.rules_text === card.rules_text
    ? '<div class="warn">効果の値を変えたが、効果文はまだ元のまま。数字を直す。</div>' : "";
}

// 効果の値を変えたとき、効果文にその数字がちょうど1か所だけあれば一緒に書き換える
function followRulesText(oldValue, newValue) {
  const pattern = new RegExp(`(?<![0-9])${oldValue}(?![0-9])`, "g");
  const hits = draft.rules_text.match(pattern) || [];
  if (hits.length !== 1) return;
  draft.rules_text = draft.rules_text.replace(pattern, String(newValue));
  $("#rules").value = draft.rules_text;
}

function changes() {
  const card = original();
  const out = {};
  for (const key of ["cost", "total_sand", "rules_text"]) if (draft[key] !== card[key]) out[key] = draft[key];
  const effects = draft.effects.map((e, i) => {
    const diff = { sub_id: e.sub_id };
    for (const key of ["value", "condition_total"]) if (e[key] !== card.effects[i][key]) diff[key] = e[key];
    return diff;
  }).filter((d) => Object.keys(d).length > 1);
  if (effects.length) out.effects = effects;
  return out;
}

async function save(extra = {}) {
  const body = { ...changes(), ...extra };
  if (!Object.keys(body).length) { $("#status").textContent = "変更なし"; return; }
  $("#status").textContent = "保存中…";
  try {
    const res = await api(`/api/save/${selectedId}`, body);
    const keepJob = job;
    await load();
    job = keepJob;
    renderJob();
    $("#status").textContent = "保存した";
    $("#saveInfo").innerHTML = `<div class="note">
      ${res.hourglasses_updated ? "Hourglasses.md の行も更新した。" : '<span class="warn">Hourglasses.md に行が見つからなかった。</span>'}
      ${res.docs_mentioning.length ? `<br>このカード名が出てくる仕様書: ${res.docs_mentioning.map(esc).join(", ")}(数値が書かれていれば手で直す)` : ""}
      <br>仕上げに <code>bash tools/check.sh</code> を回す(テストがカードの数値に依存していることがある)。</div>`;
  } catch (e) {
    $("#status").textContent = "保存に失敗: " + e.message;
  }
}

async function measure() {
  const params = {
    games: +$("#games").value, seed: +$("#seed").value,
    sweep: $("#sweep").value, totals: $("#totals")?.value || "",
    effect: $("#effectIndex") ? +$("#effectIndex").value : 0, values: $("#values")?.value || "",
  };
  if (Object.keys(changes()).length && !confirm("未保存の入力がある。測定は保存済みの .tres を使う。このまま測る?")) return;
  try {
    const res = await api(`/api/measure/${selectedId}`, params);
    job = { id: res.job, card_id: selectedId, lines: [], results: [], done: false };
    poll();
  } catch (e) {
    $("#measureStatus").textContent = e.message;
  }
}

async function poll() {
  if (!job || job.done) return;
  const current = job;
  const res = await api(`/api/jobs/${current.id}`);
  Object.assign(current, res);
  if (job === current) renderJob();
  if (!current.done) setTimeout(poll, 1500);
}

function renderJob() {
  const box = $("#results");
  if (!box) return;
  if (!job || job.card_id !== selectedId) { box.innerHTML = ""; $("#measureStatus").textContent = ""; return; }
  $("#measure").disabled = !job.done;
  $("#measureStatus").textContent = job.done ? (job.exit_code === 0 ? "測定完了" : `終了コード ${job.exit_code}`) : `測定中… ${job.results.length} 件め`;
  const card = original();
  const rows = job.results.map((r, i) => {
    const same = r.cost === card.cost && (card.is_spell || r.total_sand === card.total_sand)
      && (r.effect === null || card.effects[r.effect].value === r.value);
    return `<tr>
      <td>${r.cost}</td>${card.is_spell ? "" : `<td>${r.total_sand}</td>`}<td>${r.value === null ? "—" : `効果${r.effect}=${r.value}`}</td>
      <td class="rate" style="color:${rateColor(r.winrate + "%")}">${r.winrate.toFixed(1)}%<span class="bar" style="width:${Math.max(0, r.winrate - 30) * 2}px"></span></td>
      <td><button class="small ${same ? "" : "secondary"}" data-adopt="${i}">${same ? "勝率を書き込む" : "採用して保存"}</button></td>
    </tr>`;
  }).join("");
  box.innerHTML = (rows ? `<table><tr><th>コスト</th>${card.is_spell ? "" : "<th>総量</th>"}<th>効果の値</th><th>勝率</th><th></th></tr>${rows}</table>
    <div class="note">目安は ${TARGET_BAND.low}〜${TARGET_BAND.high}%(50%で同コスト帯の平均と釣り合う)。「採用して保存」は効果文の数字を直してから押す。</div>` : "")
    + `<pre>${esc(job.lines.join("\n"))}</pre>`;
}

function adopt(i) {
  const r = job.results[i];
  draft.cost = r.cost;
  if (!original().is_spell) draft.total_sand = r.total_sand;
  if (r.effect !== null) {
    const old = draft.effects[r.effect].value;
    draft.effects[r.effect].value = r.value;
    if (old !== r.value) followRulesText(old, r.value);
  }
  save({ winrate: `${r.winrate.toFixed(1)}%` });
}

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-id],[data-kind],[data-set],[data-adopt],#save,#reset,#measure");
  if (!t) return;
  if (t.dataset.id) select(t.dataset.id);
  else if (t.dataset.kind) { kind = t.dataset.kind; renderFilters(); renderList(); }
  else if (t.dataset.set !== undefined) { setFilter = setFilter === t.dataset.set ? null : t.dataset.set; renderFilters(); renderList(); }
  else if (t.dataset.adopt !== undefined) adopt(+t.dataset.adopt);
  else if (t.id === "save") save();
  else if (t.id === "reset") select(selectedId);
  else if (t.id === "measure") measure();
});

document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "search") { renderList(); return; }
  if (!el.dataset.key || !draft) return;
  if (el.dataset.effect !== undefined) {
    const effect = draft.effects[+el.dataset.effect];
    const next = parseInt(el.value, 10);
    if (isNaN(next)) return;
    if (el.dataset.key === "value") followRulesText(effect.value, next);
    effect[el.dataset.key] = next;
  } else if (el.dataset.key === "rules_text") {
    draft.rules_text = el.value;
  } else {
    const next = parseInt(el.value, 10);
    if (!isNaN(next)) draft[el.dataset.key] = next;
  }
  refreshDirty();
});

load().catch((e) => { $("#editor").innerHTML = `<div class="empty">読み込みに失敗: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
